name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    # Documentation conventions (docs/conventions.md). Standard library only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/docs.py check

  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}       # login shell, so the micromamba env is on PATH
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - run: pytest -q             # from the repo root (tests/conftest.py)
