name: Scaffold

# The scaffold must work as a fresh repository: index, check, and the docs tool's tests.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh repository from the scaffold
        run: |
          cp -r scaffold "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          git init -q
          python scripts/docs.py check
          python scripts/docs.py new line demo --title "Demo line"
          python scripts/docs.py new prespec demo "first step"
          python scripts/docs.py index
          python scripts/docs.py check
          pip install -q pytest
          pytest -q tests
